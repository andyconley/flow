# Optional overrides only: install/update supplies built-in Claude, Codex and
# machine-local Ollama profiles without this file.
# See docs/openhands-policy-routing.md for local configuration and policy eligibility.

[stages.implement]
profile = "ollama"

[workspace]
kind = "local"
# Native workers retain native permissions; a cwd is not an OS sandbox.
# confirmation = "always" # Opt out of the SDK automatic dispatch default.

# Per-role explicit overrides are independent of the coordinator profile:
# [roles.test-engineer]
# profile = "codex"
# [roles.quality-reviewer]
# profile = "claude"

# Existing local_machine settings supply an Ollama profile when a model is set.
# An explicit alternative local endpoint can be configured here:
# [profiles.local-worker]
# kind = "local"
# model = "ollama_chat/your-tool-capable-model"
# base_url = "http://127.0.0.1:11434"
# max_input_tokens = 16384
# max_output_tokens = 2048
# condenser_max_tokens = 13312
# [roles.tech-writer]
# profile = "local-worker"
# tools = ["file_editor"]

# An explicit roster narrows logical-role dispatch (include lead-developer if
# it must implement changes or assemble durable outputs):
# [roles.lead-developer]
# specialists = ["lead-developer", "test-engineer", "quality-reviewer"]
# context = ["docs/architecture.md"]
# skills = [".agents/skills/project-tests/SKILL.md"]

# Native profile model/session/permission customizations are preserved.
# Omitted permission_requests inherits stock-openhands automatic handling.
# Set interactive below to require human terminal choices.
# [profiles.claude]
# session_mode = "default"
# permission_requests = "interactive"
# [profiles.codex]
# session_mode = "agent"
# permission_requests = "interactive"
