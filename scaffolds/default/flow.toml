# CLI command summaries for the flow-help framework-overview table. The slash-
# commands and agents tables are derived from [[claude.commands]] and shared
# [[agents]] above; CLI commands aren't in those arrays (they're in
# cli/flow.py), so their short summaries live here.
[[help.cli_commands]]
invocation = "flow help"
summary = "This overview, but rendered at the shell (same content as `/flow-help`)"

[[help.cli_commands]]
invocation = "flow setup machine"
summary = "First-time machine setup — creates `~/.flow/` support directories"

[[help.cli_commands]]
invocation = "flow setup user"
summary = "Install flow at user level (active in every supported runtime session)"

[[help.cli_commands]]
invocation = "flow setup project"
summary = "Scaffold `.flow/` overlay into the current repo"

[[help.cli_commands]]
invocation = "flow refresh project"
summary = "Repair overlay core files and registered local sources"

[[help.cli_commands]]
invocation = "flow sync claude [--user] [--check]"
summary = "Generate or check Claude adapters"

[[help.cli_commands]]
invocation = "flow sync codex [--user] [--check]"
summary = "Generate or check Codex adapters"

[[help.cli_commands]]
invocation = "flow install --release / flow install --develop <path>"
summary = "Convert the local install between modes (symlink ↔ copy)"

[[help.cli_commands]]
invocation = "flow update [--check] [--resync]"
summary = "Roll a release install forward to the latest tagged release"

[[help.cli_commands]]
invocation = "flow bootstrap"
summary = "Validate the current repo's `.flow/` structure"

[[help.cli_commands]]
invocation = "flow doctor"
summary = "Report machine, install, user-level, and project-level state"

[[help.cli_commands]]
invocation = "flow project audit"
summary = "Classify a repo's `.flow/` overlay against the framework (read-only)"

[[help.cli_commands]]
invocation = "flow project migrate"
summary = "Remove the framework copies `audit` finds; dry run unless `--apply --yes`"
