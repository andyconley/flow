[framework]
name = "flow"
version = 1

[project]
flow_dir = ".flow"
source_of_truth = ".flow"

# Declared dependencies on upstream standards. Each block names the upstream
# source, the version flow is pinned to, and where the verbatim vendor mirror
# lives. Run `scripts/refresh-conventional-commits.py` to roll a vendor forward.
[standards.git-commits]
spec = "Conventional Commits"
upstream = "https://www.conventionalcommits.org/en/v1.0.0/"
upstream_repo = "https://github.com/conventional-commits/conventionalcommits.org"
upstream_version = "v1.0.0"
upstream_license = "MIT"
vendored_path = "standards/vendor/conventional-commits-1.0.0.md"
vendored_sha = "7d293dc59e88abc8ce6c6698344d4da518ff3f27"
vendored_at = "2026-05-15"
flow_standard = "standards/git-commits.md"

[claude]
skill_dir = ".claude/skills"
agent_dir = ".claude/agents"
hook_dir = ".claude/hooks"
settings_file = ".claude/settings.json"
managed_manifest = ".claude/flow.managed.toml"

[claude.skill_defaults]
disable_model_invocation = true
argument_hint = "[focus]"

[claude.agent_defaults]
generation_mode = "verbatim"

[claude.settings]
preserve_unmanaged = true
manage_hooks = true
manage_settings_file = true

[codex]
skill_dir = ".codex/skills"
managed_manifest = ".codex/flow.managed.toml"

[codex.skill_defaults]
argument_hint = "[focus]"

# The `summary` field on commands and agents is the short label used by the
# flow-help framework-overview tables (generated by scripts/regenerate-flow-help.py).
# The longer `description` field is what's emitted as skill/agent metadata at sync time.
# Order matters: the slash-commands table in flow-help.md is rendered in this order.
[[claude.commands]]
name = "flow-boot"
source = "commands/flow-boot.md"
description = "Orients to the project before planning or implementation work. Use when starting a session, resuming interrupted work, or when context feels stale."
summary = "Starting a session, resuming, or context feels stale"

[[claude.commands]]
name = "flow-scout"
source = "commands/flow-scout.md"
description = "Executes small scoped changes quickly. Use for XS or S changes that do not justify a full gated run."
argument_hint = "[focus]"
summary = "XS/S changes — single primary file, no new abstractions, validates in <5min"

[[claude.commands]]
name = "flow-solution"
source = "commands/flow-solution.md"
description = "Turns approved requirements into a recommended technical approach. Optional pre-plan step when multiple approaches exist, architectural decisions are needed, or work needs to be broken into chunks before planning."
argument_hint = "[focus]"
summary = "Optional pre-plan step when multiple approaches exist or architectural decisions are needed"

[[claude.commands]]
name = "flow-plan"
source = "commands/flow-plan.md"
description = "Shapes work before implementation. Use when turning an idea, bug, or request into an implementation-ready plan."
argument_hint = "[focus]"
summary = "Idea / bug / request → implementation-ready plan"

[[claude.commands]]
name = "flow-implement"
source = "commands/flow-implement.md"
description = "Runs the gated implementation lane. Use when work spans multiple files, sessions, or decision surfaces and needs durable artifacts."
argument_hint = "[work-id or focus]"
summary = "Gated multi-phase work; runs land under `.flow/runs/<work-id>/`"

[[claude.commands]]
name = "flow-review"
source = "commands/flow-review.md"
description = "Runs structured review after implementation. Use when acceptance, correctness, UX fit, or validation still needs an explicit judgment."
argument_hint = "[work-id or focus]"
summary = "Structured review after implementation"

[[claude.commands]]
name = "flow-archive"
source = "commands/flow-archive.md"
description = "Closes out completed work and updates durable memory. Use when a slice or run is complete and ready to be archived."
argument_hint = "[work-id]"
summary = "Close a run; STATE.md → transient state; durable decisions → auto-memory"

[[claude.commands]]
name = "flow-resume"
source = "commands/flow-resume.md"
description = "Resumes interrupted work. Use when a prior run or slice should continue instead of starting over."
argument_hint = "[work-id]"
summary = "Pick up interrupted work"

[[claude.commands]]
name = "flow-status"
source = "commands/flow-status.md"
description = "Summarizes current execution state. Use when the question is where the project stands and what should happen next."
summary = "Where are we, what's next?"

[[claude.commands]]
name = "flow-init-project"
source = "commands/flow-init-project.md"
description = "Walks the user through filling in `.flow/PROJECT.md` with inferred proposals after `flow setup project`. Use right after scaffolding a new project overlay, or to refresh an existing PROJECT.md."
summary = "Walk through filling in `.flow/PROJECT.md` (right after `flow setup project`)"

[[claude.commands]]
name = "flow-help"
source = "commands/flow-help.md"
description = "Shows the flow framework overview: phase machine, command catalog, agent roster, and architecture summary. Use to remember which command does what or to orient to flow."
summary = "This help output"

[[claude.agents]]
name = "architect"
source = "agents/architect.md"
summary = "Boundaries, integrations, ADR decisions"

[[claude.agents]]
name = "solution-architect"
source = "agents/solution-architect.md"
summary = "Consulting design partner — walks options, tradeoffs, principles, and recommended design artifacts before plan"

[[claude.agents]]
name = "business-analyst"
source = "agents/business-analyst.md"
summary = "Problem framing, acceptance criteria"

[[claude.agents]]
name = "quality-reviewer"
source = "agents/quality-reviewer.md"
summary = "Pre-acceptance review of any deliverable (code, docs, analyses, runbooks)"

[[claude.agents]]
name = "data-engineer"
source = "agents/data-engineer.md"
summary = "Persistent state changes, schema, migration"

[[claude.agents]]
name = "lead-developer"
source = "agents/lead-developer.md"
summary = "Execution planning, slice sequencing"

[[claude.agents]]
name = "product-manager"
source = "agents/product-manager.md"
summary = "Scope, prioritization, tradeoff framing"

[[claude.agents]]
name = "security-reviewer"
source = "agents/security-reviewer.md"
summary = "Sensitive surfaces, secrets, auth"

[[claude.agents]]
name = "sre"
source = "agents/sre.md"
summary = "Rollout, runtime, observability"

[[claude.agents]]
name = "support-lead"
source = "agents/support-lead.md"
summary = "Operator-facing notes, troubleshooting"

[[claude.agents]]
name = "tech-writer"
source = "agents/tech-writer.md"
summary = "Durable summary, memory wording, handback"

[[claude.agents]]
name = "test-engineer"
source = "agents/test-engineer.md"
summary = "Coverage strategy, validation depth"

[[claude.agents]]
name = "ux-specialist"
source = "agents/ux-specialist.md"
summary = "Interaction states, accessibility"

[[claude.hooks]]
name = "flow-session-start"
event = "SessionStart"
matcher = "startup|resume|clear|compact"
type = "command"
script = "flow-session-start.sh"

[[claude.hooks]]
name = "flow-managed-write-reminder"
event = "PostToolUse"
matcher = "Write|Edit"
type = "command"
script = "flow-managed-write-reminder.sh"

