[[claude.hooks]]
name = "flow-session-start"
event = "SessionStart"
matcher = "startup|resume|clear|compact"
type = "command"
script = "flow-session-start.sh"

[[claude.hooks]]
name = "flow-managed-write-reminder"
event = "PostToolUse"
matcher = "Write|Edit"
type = "command"
script = "flow-managed-write-reminder.sh"

# Claude only: Codex maintains no equivalent usage counters, which
# `data/harness_capabilities.json` records as plugin_usage_counters = 0. No
# matcher, so it fires on every session start rather than only inside a flow
# project — the counters are user-level state and gating on a project manifest
# would record history from only the directories that happen to carry one.
[[claude.hooks]]
name = "flow-plugin-usage"
event = "SessionStart"
type = "command"
script = "flow-plugin-usage.sh"
timeout = 10

# [[codex.hooks]] entries use the same shape (name/event/matcher/type/script,
# optional timeout/status_message). They deploy scripts to hook_dir and merge
# handler entries into hooks_file (.codex/hooks.json) under the same
# preserve-unmanaged contract as Claude's settings.json — config.toml is
# never touched. matcher is optional for Codex: omitted means match-everything.

[[claude.hooks]]
name = "flow-token-verdict"
event = "Stop"
type = "command"
script = "flow-token-verdict.sh"
timeout = 15
status_message = "checking context carry"

[[claude.hooks]]
name = "flow-context-warning"
event = "UserPromptSubmit"
type = "command"
script = "flow-context-warning.sh"
timeout = 10

[[codex.hooks]]
name = "flow-token-verdict"
event = "Stop"
type = "command"
script = "flow-token-verdict.sh"
timeout = 15
status_message = "checking context carry"

[[codex.hooks]]
name = "flow-context-warning"
event = "UserPromptSubmit"
type = "command"
script = "flow-context-warning.sh"
timeout = 10

# The overlay-commit nudge. Registered on UserPromptSubmit rather than Stop
# because Stop's stdout reaches the transcript, not the model — the same
# constraint that makes flow-token-verdict.sh write a file instead of print.
# PostToolUse catches the edit while it is fresh; UserPromptSubmit catches
# whatever is still outstanding at the next turn boundary. Silent unless the
# overlay is a repo with something to commit, so this costs nothing for
# anyone who has not opted in.

[[claude.hooks]]
name = "flow-overlay-reminder"
event = "PostToolUse"
matcher = "Write|Edit"
type = "command"
script = "flow-overlay-reminder.sh"
timeout = 10

[[claude.hooks]]
name = "flow-overlay-reminder"
event = "UserPromptSubmit"
type = "command"
script = "flow-overlay-reminder.sh"
timeout = 10

# No matcher on the Codex side, deliberately. Sampling real Codex transcripts
# under ~/.codex/sessions shows its tool names are `exec` and friends, not
# `Write`/`Edit` — a Claude-shaped matcher here would never match, and the
# nudge would be silently dead on this runtime. Matching everything is the
# safe direction because `flow overlay check --hook` resolves the repo root
# first and exits after one cheap git call for anything irrelevant.
[[codex.hooks]]
name = "flow-overlay-reminder"
event = "PostToolUse"
type = "command"
script = "flow-overlay-reminder.sh"
timeout = 10

[[codex.hooks]]
name = "flow-overlay-reminder"
event = "UserPromptSubmit"
type = "command"
script = "flow-overlay-reminder.sh"
timeout = 10

