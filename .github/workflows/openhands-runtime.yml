name: Flow v2 production package and consumer
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-runtime:
    uses: ./.github/workflows/goose-build.yml
    with:
      source_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      version: v0.51.0
