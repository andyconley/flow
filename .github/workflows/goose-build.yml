name: Pinned Goose build and v2 distribution
on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      version:
        required: true
        type: string
    outputs:
      artifact_name:
        value: ${{ jobs.build-goose.outputs.artifact_name }}
      manifest_sha256:
        value: ${{ jobs.build-goose.outputs.manifest_sha256 }}
permissions:
  contents: read
jobs:
  build-goose:
    runs-on: macos-15
    timeout-minutes: 90
    outputs:
      artifact_name: ${{ steps.identity.outputs.artifact_name }}
      manifest_sha256: ${{ steps.identity.outputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
      - name: Qualify build host and pinned compiler
        run: |
          test "$(uname -s)/$(uname -m)" = Darwin/arm64
          rustup toolchain install 1.99.0 --profile minimal
          rustup default 1.99.0
          rustc --version
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .release/goose-target
          key: goose-macos15-arm64-rust199-release-${{ hashFiles('v2/vendor/goose.lock.json', 'v2/vendor/goose-native.patch') }}
      - name: Build locked patched Goose and hashed distribution assets
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERSION: ${{ inputs.version }}
        run: python3 scripts/build_v2_release.py --version "$VERSION" --source-sha "$SOURCE_SHA" --output .release/dist
      - name: Verify real package installation and offline consumers
        run: python3 scripts/verify_v2_consumer.py --bundle .release/dist --output .release/consumer-verification.json
      - name: Bind artifact identity
        id: identity
        run: |
          echo "artifact_name=v2-distribution-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
          echo "manifest_sha256=$(shasum -a 256 .release/dist/release-manifest.json | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.identity.outputs.artifact_name }}
          path: |
            .release/dist
            .release/consumer-verification.json
          if-no-files-found: error
          retention-days: 14
