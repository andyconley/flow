name: Archive runtime verification
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archive-runtime:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Record exact interpreter and FTS5 capability
        run: |
          python cli/archive_preflight.py
          python -c 'import sys, sqlite3; print(sys.executable, sys.version, sqlite3.sqlite_version); c=sqlite3.connect(":memory:"); c.execute("CREATE VIRTUAL TABLE evidence USING fts5(text)")'
      - name: Archive and capability regressions
        run: |
          python -m unittest discover -s tests -p 'test_archive*.py'
          python -m unittest tests/test_retrieval_capability.py
