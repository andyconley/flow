- type: builtin
  name: developer
- type: platform
  name: skills
settings:
  goose_provider: claude-acp
  goose_model: haiku
  max_turns: 4
response:
  json_schema:
    type: object
    additionalProperties: false
    properties:
      success:
        type: boolean
      summary:
        type: string
      verdict:
        type: string
        enum:
        - completed
        - implemented
        - approve
        - request_changes
        - blocked
      findings:
        type: array
        items:
          type: string
      verification:
        type: array
        items:
          type: string
      limitations:
        type: array
        items:
          type: string
    required:
    - success
    - summary
    - verdict
    - findings
    - verification
    - limitations
