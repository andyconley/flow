version: 1.0.0
title: flow-define
description: Goose/LangGraph define coordination; human decisions remain explicit
instructions: 'Goose coordinates the define stage and dispatches specialists through
  summon, normally source business-analyst. The native host only handles conversation
  and human approvals. Research evidence, needs, constraints, uncertainties and testable
  outcomes.

  Do not delegate coordination, research, synthesis or planning to the native host.
  Read the exact approved assignment and project context; preserve uncertainty and
  scope/permission boundaries. Return a substantive result for a controlled stage
  artifact; no result authorizes implementation.

  Assignment: {{{{ assignment_file }}}}

  Project context: {{{{ project_context | indent(2) }}}}

  '
prompt: Return the requested substantive shaping result and limitations.
parameters:
- key: assignment_file
  input_type: string
  requirement: required
  description: Exact controlled assignment revision file
- key: project_context
  input_type: string
  requirement: required
  description: Resolved project facts/instructions, separate from role expertise
extensions:
- type: builtin
  name: developer
- type: builtin
  name: summon
- type: platform
  name: skills
